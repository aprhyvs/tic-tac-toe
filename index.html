<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <button id="start-game">
      Start game
    </button>
    <p>
      Turn: <span id="player-turn"></span>
    </p>

    <p id="player-winner"></p>

    <div class="player-stats">
      <p>Player 1: <span id="player1-name"></span></p>
      <p id="player1-score"></p>
    </div>

    <div class="player-stats">
      <p>Player 2: <span id="player2-name"></span></p>
      <p id="player2-score"></p>
    </div>

    <button id="open-change-name">
      Open Change Name
    </button>
  </header>
  <div class="gameboard" id="game-board">
  </div>

  <dialog class="form-modal" id="add-name-modal">
    <button id="close-modal">
      Close
    </button>

    <form class="form" action="" id="name-form">
      <label for="player1">Player 1 Name</label>
      <input type="text" name="player1">

      <label for="player2">Player 2 Name</label>
      <input type="text" name="player2">

      <button type="submit" id="submit-names">
        Send Names
      </button>
    </form>
  </dialog>
</body>
</html>
